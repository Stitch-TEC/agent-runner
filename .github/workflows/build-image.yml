name: build-image

# One-click Claude Code runner image build — no local Docker needed.
# Run it from the Actions tab (Run workflow); it builds the Dockerfile, pushes to
# GHCR under this org, and prints the @sha256 digest to pin as CLAUDE_CODE_IMAGE
# in copy-agent.yml. After the first run, make the package PUBLIC (Package settings
# -> Change visibility) so the copy-agent runner can pull it without auth.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - name: Build + push to GHCR
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER/claude-code-runner"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:2.1.206" -t "$IMAGE:latest" .
          docker push "$IMAGE:2.1.206"
          docker push "$IMAGE:latest"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:2.1.206")"
          echo "## Pin this as CLAUDE_CODE_IMAGE in copy-agent.yml (line 59):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST => $DIGEST"
